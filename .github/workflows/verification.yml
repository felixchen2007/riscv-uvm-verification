name: Verification
on: [workflow_dispatch]
jobs:
  utilities:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-verification.txt
      - run: python -m pytest -q tests --basetemp build/python-tests/ci
  native-v1:
    # Install/configure Vivado, Questa Starter and pinned Spike/WSL on this runner.
    runs-on: [self-hosted, Windows, riscv-uvm]
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: ./scripts/v1.ps1 -Output build/releases/ci-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            build/releases/ci-*/release.json
            build/releases/ci-*/report.md
            build/releases/ci-*/*.log

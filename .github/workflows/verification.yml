# Runs the Python checks on a hosted Windows runner.
# Runs Vivado and Spike qualification on the configured self-hosted runner.

name: Verification
on: [workflow_dispatch]
jobs:
  utilities:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -S scripts/run_python_checks.py --output build/python-tests/ci
  native:
    # Install/configure Vivado and Python and Ubuntu WSL build prerequisites on this runner.
    runs-on: [self-hosted, Windows, riscv-uvm]
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: ./scripts/verify.ps1 -Output build/releases/ci-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            build/releases/ci-*/release.json
            build/releases/ci-*/report.md
            build/releases/ci-*/*.log
